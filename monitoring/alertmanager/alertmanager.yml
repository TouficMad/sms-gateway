route:
  receiver: noc
  group_by: [alertname, carrier]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: noc
      repeat_interval: 1h

receivers:
  - name: noc
    # Uncomment to send alerts to Slack:
    # slack_configs:
    #   - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    #     channel: "#noc-sms"
    #     send_resolved: true
    #     title: '{{ .CommonAnnotations.summary }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # a disconnected carrier also opens its circuit: page once
  - source_matchers: [alertname="SmsCarrierDisconnected"]
    target_matchers: [alertname="SmsCarrierCircuitOpen"]
    equal: [carrier]
